<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Branch tree · Luma Guardian Wiki</title>
<meta name="theme-color" content="#2B2253">
<script>try{var t=localStorage.getItem('luma.theme.v1');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600&display=swap">
<link rel="stylesheet" href="assets/wiki.css">
<link rel="stylesheet" href="assets/tree.css">
<link rel="stylesheet" href="assets/tree-colors.css">
<script src="assets/wiki.js" defer></script>
<script src="assets/tree.js" defer></script>
<script>addEventListener('DOMContentLoaded',()=>{Wiki.boot('tree').catch(()=>{});});</script>
</head>
<body>
<dialog id="full" aria-label="Full profile"></dialog>
<main id="main" class="page">
  <div class="crumbs"><a href="index.html">Home</a><span class="sep">›</span><span>Branch tree</span></div>
  <h1 style="font-size:30px;margin-bottom:6px">Branch tree</h1>
  <p class="muted" style="margin:0">Pick an element tab to see its branches. Click any box for a quick profile, then View full info or open the Guardian's wiki page.</p>
  <div class="tabs" role="tablist" id="tabs" aria-label="Elements"></div>
  <div class="toggles" role="group" aria-label="Display options">
    <label class="chk"><input type="checkbox" id="infer" checked> <span>Show disciples without a profile (gray boxes)</span></label>
    <label class="chk"><input type="checkbox" id="hidegone"> <span>Hide deceased / retired Guardians</span></label>
  </div>
  <section id="panel" aria-live="polite"></section>
</main>
</body>
</html>
